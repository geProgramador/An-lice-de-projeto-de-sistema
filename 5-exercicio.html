<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comparação</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, Helvetica, sans-serif;
        }

        .container {
            width: 350px;
            padding: 30px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            margin-top: 0;
            margin-bottom: 25px;
            text-align: center;
            color: #333;
        }

        p {
            margin-bottom: 8px;
            color: #555;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.4);
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background-color: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #5568d8;
            transform: translateY(-2px);
        }

        h3 {
            min-height: 25px;
            margin-top: 25px;
            padding: 12px;
            text-align: center;
            color: #333;
            background-color: #f4f4f4;
            border-radius: 8px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Comparação</h1>

        <p>Digite o primeiro número:</p>
        <input type="number" id="caixa1">

        <p>Digite o segundo número:</p>
        <input type="number" id="caixa2">

        <button>Analisar</button>

        <h3></h3>

    </div>

    <script>
        let caixa1 = document.querySelector("#caixa1");
        let caixa2 = document.querySelector("#caixa2");
        let botao = document.querySelector("button");
        let resultado = document.querySelector("h3");

        botao.addEventListener("click",function (){
            if (caixa1.value > caixa2.value){
                resultado.textContent = 'o maior número é ' + caixa1.value;
                
            } else if(caixa2.value > caixa1.value){
                resultado.textContent = 'o maior número é ' + caixa2.value;
            }else{
                resultado.textContent = 'os valores são iguais!';
            }
        })
    </script>

</body>
</html>
